<!DOCTYPE html>
<html lang="zh">
<head>
    <link rel="preload" href="api/preload" as="fetch">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coex Automation System</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="css/style.css">
    <link rel="manifest" href="manifest.json">
</head>
<body>
    <div class="container">
        <aside class="toolbar">
            <div class="unit-search-container">
                <label for="unit_search_input"></label><input type="text" id="unit_search_input" class="no-select" placeholder="Search units...">
                <div class="search-options">
                    <button id="btn_unit_regex" class="no-select" title="Regular Expression">.*</button>
                    <button id="btn_unit_case" class="no-select" title="Match Case">Aa</button>
                </div>
            </div>
            <div id="unit_list" class="unit-list" tabindex="0">
                <!-- Units will be injected here -->
            </div>
            <div id="control_button_bar" class="control-button-bar">
                <button id="btn_test" class="no-select">Test</button>
                <button id="btn_log" class="no-select">Log</button>
                <button id="btn_setting" class="no-select">Setting</button>
            </div>
            <div class="host-switcher-bar">
                <button id="btn_host" class="btn-host-switch no-select">
                    <span id="current_host_name">Loading</span>
                </button>
            </div>
        </aside>
        <main class="main-view">
            <div id="main_content">
                <h1>StressRack Test</h1>
                <p>Select a unit to see details or logs.</p>
            </div>
            <div id="tool_view" class="tool-view" style="display: none;">
                <div class="unit-tool">
                </div>
                <div class="battery-drain">
                    <input type="number" id="drain_power_input" class="drain-input" min="0" max="100" value="5" placeholder="0-100">
                    <button id="btn_drain" class="cmd-btn drain-btn">drain</button>
                </div>
                <div class="loop-untils">
                    <div class="loop-cmd">
                        <div class="loop-list" id="loop_list">
                            <span class="loop-list-placeholder">Drag commands here</span>
                        </div>
                        <button id="btn_loop_toggle" class="cmd-btn loop-btn no-select">Loop</button>
                    </div>
                    <div class="loop-results">
                        <table class="script-table loop-table">
                            <thead id="loop_results_header">
                                <tr><th>ECID</th></tr>
                            </thead>
                            <tbody id="loop_results_body"></tbody>
                        </table>
                    </div>
                </div>
            </div>
            <div id="toast_container" class="toast-container"></div>
        </main>
    </div>

    <!-- Modal for adding script -->
    <div id="modal_overlay" class="modal-overlay">
        <div class="modal">
            <div class="modal-header">
                <h2>Add New Script(s)</h2>
                <button id="btn_scan_script">Scan</button>
            </div>
            <div class="script-entry-header">
                <span>Script Name</span>
                <span>Script Path</span>
                <span class="btn-remove-col"></span>
            </div>
            <div id="script_entry_list" class="script-entry-list">
                <!-- Dynamic script entries -->
            </div>
            <div class="modal-actions">
                <button id="btn_add_entry">+ Add Entry</button>
                <div style="flex:1"></div>
                <button id="btn_modal_cancel">Cancel</button>
                <button id="btn_modal_add" class="btn-add-primary">Add Scripts</button>
            </div>
        </div>
    </div>

    <!-- Modal for selecting methods -->
    <div id="method_modal_overlay" class="modal-overlay">
        <div class="modal">
            <h2 id="method_modal_title">Select Method</h2>
            <div class="method-search-container">
                <label for="method_search_input"></label><input type="text" id="method_search_input" class="no-select" placeholder="Search methods...">
                <div class="search-options">
                    <button id="btn_search_regex" class="no-select" title="Regular Expression">.*</button>
                    <button id="btn_search_case" class="no-select" title="Match Case">Aa</button>
                </div>
            </div>
            <div id="method_list" class="method-list">
                <!-- Methods will be injected here -->
            </div>
            <div class="modal-actions">
                <button id="btn_method_cancel">Cancel</button>
                <button id="btn_method_confirm" class="btn-add-primary" disabled>Run Test</button>
            </div>
        </div>
    </div>

    <!-- Modal for host management -->
    <div id="host_modal_overlay" class="modal-overlay">
        <div class="modal">
            <h2>Manage Hosts</h2>
            <div id="host_list" class="host-list">
                <!-- Hosts will be injected here -->
            </div>
            <hr style="margin: 20px 0; border: none; border-top: 1px solid var(--border-color);">
            <h3>Add New Host</h3>
            <div class="form-group" style="margin-top: 15px;">
                <label for="new_host_name">Name:</label>
                <input type="text" id="new_host_name" placeholder="e.g. Server 1">
            </div>
            <div class="form-group">
                <label for="new_host_url">URL:</label>
                <input type="text" id="new_host_url" placeholder="http://127.0.0.1:8196">
            </div>
            <div class="modal-actions">
                <button id="btn_host_cancel">Close</button>
                <button id="btn_host_add" class="btn-add-primary">Add Host</button>
            </div>
        </div>
    </div>

    <!-- Confirm Modal -->
    <div id="confirm_modal_overlay" class="modal-overlay">
        <div class="modal confirm-modal">
            <h2 id="confirm_modal_title">Confirm</h2>
            <p id="confirm_modal_message" class="confirm-modal-message"></p>
            <div class="modal-actions">
                <button id="btn_confirm_cancel">Cancel</button>
                <button id="btn_confirm_ok" class="btn-add-primary">OK</button>
            </div>
        </div>
    </div>

    <!-- Modal for More Detail Info -->
    <div id="detail_info_modal_overlay" class="modal-overlay">
        <div class="modal detail-info-modal">
            <div class="modal-header">
                <h2>More Detail Info</h2>
                <button id="btn_detail_info_close" class="modal-close-btn">&times;</button>
            </div>
            <div id="detail_info_content" class="detail-info-content">
                <!-- Detail info will be injected here -->
            </div>
        </div>
    </div>

    <script type="module" src="js/main.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.register('/service-worker.js').then(registration => {
            registration.onupdatefound = () => {
              const installingWorker = registration.installing;
              if (installingWorker) {
                installingWorker.onstatechange = () => {
                  if (installingWorker.state === 'installed' && navigator.serviceWorker.controller) {
                      window.location.reload();
                    }
                };
              }
            };
          }).catch(error => {
            console.error('Service Worker register failed:', error);
          });
        }
    </script>
    <script>
        document.addEventListener('contextmenu', function(event) {
            event.preventDefault();
        });
    </script>
    <script>
        document.addEventListener('keydown', function (e) {
            if (e.key === 'F12') {
                e.preventDefault();
            }
            if ((e.ctrlKey || e.metaKey) && e.shiftKey) {
                if (e.key === 'I' || e.key === 'J' || e.key === 'C') {
                    e.preventDefault();
                }
            }
            if ((e.ctrlKey || e.metaKey) && e.shiftKey && e.key === 'C') {
                e.preventDefault();
            }
        });
    </script>
</body>
</html>
